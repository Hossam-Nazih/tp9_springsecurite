# Base H2 en memoire, recreee a chaque execution, en mode compatible MySQL
spring.datasource.url=jdbc:h2:mem:securitydb_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
