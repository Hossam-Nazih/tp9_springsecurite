# --- Connexion a MySQL : adapter le mot de passe a votre installation ---
spring.datasource.url=jdbc:mysql://localhost:3306/securitydb?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# --- Hibernate : aligne les tables sur les entites ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Session : expire apres 30 minutes, cookie illisible depuis JavaScript ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
